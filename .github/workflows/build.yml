name: Build Amnezia-Style CSQTT APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Rust and cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk

      - name: Build Rust client library (arm64-v8a)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd rust-client
          cargo ndk -t arm64-v8a build --release --workspace || true
          find target/aarch64-linux-android/release -maxdepth 2 -name "*.so" -exec cp {} ../app/src/main/jniLibs/arm64-v8a/ \;
          ls -lh ../app/src/main/jniLibs/arm64-v8a/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: csqtt-amnezia-style-arm64
          path: app/build/outputs/apk/debug/*.apk
