name: Build Amnezia-Style CSQTT APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37 build-tools;37.0.0 ndk;27.2.12479018'

      - name: Install Rust and cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk

      - name: Build Rust client library (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          mkdir -p app/src/main/jniLibs
          cd rust-client
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: csqtt-amnezia-style-arm64
          path: app/build/outputs/apk/debug/*.apk
